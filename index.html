<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound City Map</title>

  <link rel="stylesheet" href="./styles.css?v=effectswitch1">
</head>
<body>
  <div class="app">

    <!-- ===== 왼쪽: 지도 영역 ===== -->
    <section class="map-panel">

      <!-- [내 담당 1] 상단 헤더: 이름 + 작은 설명 + 범례 -->
      <header class="map-header">
        <div class="map-title-group">
          <h1 class="map-title">SOUND CITY MAP</h1>
          <p class="map-subtitle">지도를 드래그해 도시를 둘러보고 건물을 클릭해 선택해 봐</p>
        </div>
      </header>

      <!-- 지도(건물) 영역: JS 담당 팀원이 canvas 또는 건물 요소를 여기에 넣으면 됨 -->
      <div class="map-stage" id="map-stage">
        <span class="map-label map-label-top">NIGHT DISTRICT</span>
        <sound-city-map></sound-city-map>
        <span class="map-label map-label-bottom">ISOMETRIC DISTRICT / 01</span>
      </div>
    </section>

    <!-- ===== 오른쪽: 플레이리스트 ===== -->
    <div id="panel-resizer" role="separator" tabindex="0" aria-label="지도와 플레이리스트 너비 조절" aria-orientation="vertical" aria-controls="playlist-panel" title="드래그하거나 좌우 방향키로 너비 조절"></div>
    <aside class="playlist-panel" id="playlist-panel">

      <!-- [내 담당 2] 플레이리스트 패널 -->
      <div class="playlist-header">
        <h2 class="playlist-title">MY PLAYLIST</h2>
        <span class="track-count" id="track-count">0 TRACKS</span>
        <button type="button" id="playlist-toggle" aria-label="플레이리스트 접기" aria-expanded="true" aria-controls="playlist-panel">플레이리스트 접기</button>
      </div>

      <!-- 검색창 -->
      <div class="search-box">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="곡 제목 또는 아티스트 검색"
          autocomplete="off"
        />
      </div>

      <label class="playlist-sort">
        <span>정렬</span>
        <select id="track-sort">
          <option value="oldest">추가한 순서</option>
          <option value="newest">최근 추가한 순서</option>
          <option value="title">제목순</option>
          <option value="artist">아티스트순</option>
          <option value="genre">장르순</option>
        </select>
      </label>

      <!-- 곡 추가 폼 (처음엔 비어 있는 리스트라서 여기서 추가) -->
      <details class="add-track" id="add-track">
        <summary class="add-track-toggle">＋ 곡 추가하기</summary>

        <form class="add-track-form" id="add-track-form">
          <label class="field">
            <span class="field-label">곡 제목</span>
            <input type="text" id="track-title" name="title" placeholder="예: Midnight Bloom" required />
          </label>

          <label class="field">
            <span class="field-label">아티스트</span>
            <input type="text" id="track-artist" name="artist" placeholder="예: Luna Archive" required />
          </label>

          <label class="field">
            <span class="field-label">장르</span>
            <select id="track-genre" name="genre" required>
              <option value="" disabled selected>장르 선택</option>
              <option value="Dream Pop">Dream Pop</option>
              <option value="Synthwave">Synthwave</option>
              <option value="Indie Folk">Indie Folk</option>
              <option value="Lo-fi">Lo-fi</option>
              <option value="Electronic">Electronic</option>
              <option value="R&B">R&amp;B</option>
              <option value="Alt Rock">Alt Rock</option>
              <option value="Jazz">Jazz</option>
              <option value="City Pop">City Pop</option>
              <option value="Ambient">Ambient</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">음원 파일 (선택)</span>
            <input type="file" id="track-file" name="file" accept="audio/*" />
          </label>

          <button type="submit" class="btn-add">플레이리스트에 추가</button>
        </form>
      </details>

      <!-- 곡 목록 -->
      <ol class="track-list" id="track-list">
        <!-- 곡이 없을 때 보이는 안내 (JS에서 곡이 추가되면 hidden 처리) -->
        <li class="empty-state" id="empty-state">
          <div class="empty-icon">♪</div>
          <p class="empty-title">아직 추가된 곡이 없어요</p>
          <p class="empty-desc">위의 “곡 추가하기”로 첫 곡을 넣어 보세요</p>
        </li>

        <!-- 곡 아이템 템플릿: JS가 이 구조를 복사해서 사용 -->
        <template id="track-item-template">
          <li class="track-item" data-id="">
            <button type="button" class="track-main">
              <span class="track-cover">✦</span>
              <span class="track-info">
                <strong class="track-name">Track Name</strong>
                <span class="track-meta">Artist · Genre</span>
              </span>
              <span class="track-number">01</span>
            </button>
            <button type="button" class="track-delete" title="곡 삭제" aria-label="곡 삭제">×</button>
          </li>
        </template>
      </ol>

      <!-- 지도 건물을 클릭한 뒤 선택한 곡을 배정하거나 연결을 해제 -->
      <section class="building-linker" aria-label="지도 건물과 곡 연결">
        <strong class="linker-title">CITY CONNECTION</strong>
        <p id="chosen-building" class="linker-text">지도에서 건물을 선택해 주세요</p>
        <p id="building-track" class="linker-sub">건물을 선택하면 곡을 배정할 수 있어요</p>
        <div class="linker-actions">
          <button type="button" id="link-track" disabled>선택한 곡 배정</button>
          <button type="button" id="unlink-track" disabled>연결 해제</button>
        </div>
      </section>

      <!-- 로컬 오디오 플레이어 -->
      <section class="player-panel" aria-label="오디오 플레이어">
        <div class="player-details">
          <strong id="now-track">재생할 곡을 선택해 주세요</strong>
          <span id="now-artist">직접 추가한 음원을 여기서 재생할 수 있어요</span>
        </div>
        <div class="player-controls">
          <button type="button" id="play-prev" aria-label="이전 곡" disabled>◀◀</button>
          <button type="button" id="play-toggle" aria-label="재생" disabled>▶</button>
          <button type="button" id="play-next" aria-label="다음 곡" disabled>▶▶</button>
          <span id="play-time">0:00 / 0:00</span>
        </div>
        <input type="range" id="play-seek" min="0" max="1000" value="0" disabled aria-label="재생 위치" />
        <audio id="audio-player" preload="metadata"></audio>
      </section>
      <p id="playlist-feedback" class="playlist-feedback" role="status" aria-live="polite"></p>
    </aside>

  </div>
<script src="./building-parts.js?v=windowshape3options"></script>
<script src="./sound-city-map.js?v=trackfocus1" defer></script>
<script src="./playlist.js?v=confirmdelete1" defer></script>
</body>
</html>
