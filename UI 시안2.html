<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound City Map</title>

  <style>
    /* ===== 기본 설정 ===== */
    :root {
      --bg: #070b18;
      --panel: #0b1124;
      --panel-soft: #101830;
      --border: rgba(120, 150, 220, 0.14);
      --text: #eaf0ff;
      --text-sub: #7f8db3;
      --accent: #5fd4ff;
      --song: #ffc83d;
      --empty: #4a5578;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #121a38 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    ul, ol { list-style: none; }

    /* ===== 전체 레이아웃 (지도 + 플레이리스트) ===== */
    .app {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      height: 100vh;
      padding: 16px;
    }

    /* ===== 왼쪽: 지도 패널 ===== */
    .map-panel {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ----- 상단 헤더 (이름 + 작은 설명) ----- */
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
    }

    .map-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .map-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 범례 */
    .legend {
      display: flex;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-sub);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-song  { background: var(--song); box-shadow: 0 0 6px var(--song); }
    .dot-empty { background: var(--empty); }

    /* 지도 영역 (JS 담당 팀원이 사용할 공간) */
    .map-stage {
      position: relative;
      flex: 1;
      margin: 16px;
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(95, 212, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 212, 255, 0.05) 1px, transparent 1px),
        #0a1022;
      background-size: 32px 32px;
      overflow: hidden;
    }

    .map-stage canvas { width: 100%; height: 100%; display: block; }

    .map-label {
      position: absolute;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(127, 141, 179, 0.5);
      pointer-events: none;
    }
    .map-label-top    { top: 14px; left: 18px; }
    .map-label-bottom { bottom: 12px; right: 18px; }

    /* ===== 오른쪽: 플레이리스트 패널 ===== */
    .playlist-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 0; /* 리스트만 스크롤되게 */
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .track-count {
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      border: 1px solid rgba(95, 212, 255, 0.4);
      border-radius: 6px;
      background: rgba(95, 212, 255, 0.08);
    }

    /* 검색창 */
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--text-sub); }
    .search-input:focus { border-color: var(--accent); }

    /* ----- 곡 추가 폼 ----- */
    .add-track {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .add-track-toggle {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
    }
    .add-track-toggle::-webkit-details-marker { display: none; }

    .add-track-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 14px 16px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--text-sub);
    }

    .field input[type="text"],
    .field select {
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .field input:focus,
    .field select:focus { border-color: var(--accent); }

    .field input[type="file"] {
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-add {
      margin-top: 4px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      color: #04101e;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
    }
    .btn-add:hover  { filter: brightness(1.1); }
    .btn-add:active { transform: scale(0.98); }

    /* ----- 곡 목록 ----- */
    .track-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      min-height: 0;
    }

    /* 빈 상태 안내 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: auto 0;
      padding: 40px 16px;
      text-align: center;
    }
    .empty-state[hidden] { display: none; }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      font-size: 24px;
      color: var(--text-sub);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
    .empty-title { font-size: 14px; font-weight: 600; }
    .empty-desc  { font-size: 12px; color: var(--text-sub); }

    /* 곡 아이템 */
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .track-item:hover  { background: rgba(120, 150, 220, 0.08); }
    .track-item.active {
      background: var(--panel-soft);
      outline: 1px solid var(--border);
    }

    .track-cover {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      font-size: 18px;
      color: #fff;
      border-radius: 10px;
      background: linear-gradient(135deg, #8a5cff, #5a3bd6); /* JS에서 장르별 색으로 교체 가능 */
    }

    .track-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-number {
      font-size: 11px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    /* 스크롤바 */
    .track-list::-webkit-scrollbar { width: 6px; }
    .track-list::-webkit-scrollbar-thumb {
      background: rgba(120, 150, 220, 0.25);
      border-radius: 3px;
    }

    /* ===== 반응형 (좁은 화면에서는 위아래로) ===== */
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
      }
      .map-stage { min-height: 360px; }
      .playlist-panel { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ===== 왼쪽: 지도 영역 ===== -->
    <section class="map-panel">

      <!-- [내 담당 1] 상단 헤더: 이름 + 작은 설명 + 범례 -->
      <header class="map-header">
        <div class="map-title-group">
          <h1 class="map-title">SOUND CITY MAP</h1>
          <p class="map-subtitle">건물에 마우스를 올려 곡을 확인하고 클릭해 선택해 봐</p>
        </div>

        <ul class="legend" aria-label="범례">
          <li class="legend-item"><span class="dot dot-song"></span>SONG</li>
          <li class="legend-item"><span class="dot dot-empty"></span>EMPTY</li>
        </ul>
      </header>

      <!-- 지도(건물) 영역: JS 담당 팀원이 canvas 또는 건물 요소를 여기에 넣으면 됨 -->
      <div class="map-stage" id="map-stage">
        <span class="map-label map-label-top">NIGHT DISTRICT</span>
        <!-- 예: <canvas id="city-canvas"></canvas> -->
        <span class="map-label map-label-bottom">ISOMETRIC DISTRICT / 01</span>
      </div>
    </section>

    <!-- ===== 오른쪽: 플레이리스트 ===== -->
    <aside class="playlist-panel">

      <!-- [내 담당 2] 플레이리스트 패널 -->
      <div class="playlist-header">
        <h2 class="playlist-title">MY PLAYLIST</h2>
        <span class="track-count" id="track-count">0 TRACKS</span>
      </div>

      <!-- 검색창 -->
      <div class="search-box">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="곡 제목 또는 아티스트 검색"
          autocomplete="off"
        />
      </div>

      <!-- 곡 추가 폼 (처음엔 비어 있는 리스트라서 여기서 추가) -->
      <details class="add-track" id="add-track">
        <summary class="add-track-toggle">＋ 곡 추가하기</summary>

        <form class="add-track-form" id="add-track-form">
          <label class="field">
            <span class="field-label">곡 제목</span>
            <input type="text" id="track-title" name="title" placeholder="예: Midnight Bloom" required />
          </label>

          <label class="field">
            <span class="field-label">아티스트</span>
            <input type="text" id="track-artist" name="artist" placeholder="예: Luna Archive" required />
          </label>

          <label class="field">
            <span class="field-label">장르</span>
            <select id="track-genre" name="genre" required>
              <option value="" disabled selected>장르 선택</option>
              <option value="Dream Pop">Dream Pop</option>
              <option value="Synthwave">Synthwave</option>
              <option value="Indie Folk">Indie Folk</option>
              <option value="Lo-fi">Lo-fi</option>
              <option value="Electronic">Electronic</option>
              <option value="R&B">R&amp;B</option>
              <option value="Alt Rock">Alt Rock</option>
              <option value="Jazz">Jazz</option>
              <option value="City Pop">City Pop</option>
              <option value="Ambient">Ambient</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">음원 파일 (선택)</span>
            <input type="file" id="track-file" name="file" accept="audio/*" />
          </label>

          <button type="submit" class="btn-add">플레이리스트에 추가</button>
        </form>
      </details>

      <!-- 곡 목록 -->
      <ol class="track-list" id="track-list">
        <!-- 곡이 없을 때 보이는 안내 (JS에서 곡이 추가되면 hidden 처리) -->
        <li class="empty-state" id="empty-state">
          <div class="empty-icon">♪</div>
          <p class="empty-title">아직 추가된 곡이 없어요</p>
          <p class="empty-desc">위의 “곡 추가하기”로 첫 곡을 넣어 보세요</p>
        </li>

        <!-- 곡 아이템 템플릿: JS가 이 구조를 복사해서 사용 -->
        <template id="track-item-template">
          <li class="track-item" data-id="">
            <div class="track-cover">✦</div>
            <div class="track-info">
              <strong class="track-name">Track Name</strong>
              <span class="track-meta">Artist · Genre</span>
            </div>
            <span class="track-number">01</span>
          </li>
        </template>
      </ol>
    </aside>

  </div>
</body>
</html>
